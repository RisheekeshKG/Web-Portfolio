    <meta name="theme-color" content="#0d0e12" />

    <script>
      // Cinematic dark is the site's default look. It only steps aside for a
      // visitor who has explicitly chosen light before — never for OS
      // preference, so the brand stays consistent. Applied pre-paint so
      // there is no flash of the wrong theme.
      (function () {
        try {
          document.documentElement.classList.toggle(
            'dark',
            localStorage.getItem('theme') !== 'light',
          )
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
