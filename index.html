    <!-- Structured data. Lives in static HTML so crawlers read it without
         executing the app's JavaScript. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Risheekesh KG",
        "url": "https://risheekesh.me/",
        "image": "https://risheekesh.me/og.png",
        "jobTitle": "AI & Software Engineer",
        "email": "mailto:risheekeshkg@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Coimbatore",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "alumniOf": [
          {
            "@type": "CollegeOrUniversity",
            "name": "PSG Institute of Technology and Applied Research"
          },
          {
            "@type": "CollegeOrUniversity",
            "name": "Indian Institute of Technology Madras"
          }
        ],
        "knowsAbout": [
          "Artificial Intelligence",
          "Machine Learning",
          "Computer Vision",
          "Generative AI",
          "Agentic AI",
          "Deep Learning",
          "React",
          "Python",
          "FastAPI",
          "Data Science"
        ],
        "sameAs": ["https://github.com/RisheekeshKG"]
      }
    </script>

    <script>
      // Cinematic dark is the site's default look. It only steps aside for a
      // visitor who has explicitly chosen light before — never for OS
      // preference, so the brand stays consistent. Applied pre-paint so
      // there is no flash of the wrong theme.
      (function () {
        try {
          document.documentElement.classList.toggle(
            'dark',
            localStorage.getItem('theme') !== 'light',
          )
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
